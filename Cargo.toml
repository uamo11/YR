[workspace]
resolver = "2"
members = [
    "crates/yr-core",
    "crates/yr-provider",
    "crates/yr-download",
    "crates/yr-audio",
    "crates/yr-app",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
authors = ["Antony <300692660+uamo11@users.noreply.github.com>"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tracing = "0.1"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-webpki-roots", "userdata"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-aac", "symphonia-isomp4", "symphonia-mp3", "symphonia-flac", "symphonia-vorbis", "symphonia-wav"] }
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "wav"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["image", "http"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[patch.crates-io]
eframe = { path = "vendor/eframe" }
egui_glow = { path = "vendor/egui_glow" }
winit = { path = "vendor/winit" }
