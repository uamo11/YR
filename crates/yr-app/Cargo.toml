[package]
name = "yr-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "yr_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "yr"
path = "src/main.rs"

[dependencies]
yr-core = { path = "../yr-core" }
yr-provider = { path = "../yr-provider" }
yr-download = { path = "../yr-download" }
yr-audio = { path = "../yr-audio" }
tokio.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
image.workspace = true
log.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
android_logger = "0.15"
winit = "0.30"

[package.metadata.android]
package = "com.yr.music"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "YR Music"

[package.metadata.android.signing.release]
path = "../../yr-release.keystore"
keystore_password = "yr_ci_password"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"
