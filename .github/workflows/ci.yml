name: YR CI & Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-core:
    name: Unit Tests (Core / Provider / Download)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace unit tests
        run: cargo test -p yr-core -p yr-provider -p yr-download

  build-android:
    name: Build Android APK (Rust)
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK and SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;35.0.0" "ndk;27.2.12479018"
          NDK_DIR="${SDK_ROOT}/ndk/27.2.12479018"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android24 --sysroot=${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--target=armv7a-linux-androideabi24 --sysroot=${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android=--target=x86_64-linux-android24 --sysroot=${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Prepare CI signing keystore
        env:
          YR_KEYSTORE_BASE64: ${{ secrets.YR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$YR_KEYSTORE_BASE64" ]; then
            echo "$YR_KEYSTORE_BASE64" | base64 -d > yr-release.keystore
            echo "Decoded persistent signing keystore from secret."
          else
            keytool -genkeypair -v \
              -keystore yr-release.keystore \
              -alias yr \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass yr_ci_password -keypass yr_ci_password \
              -dname "CN=YR Music, O=YR, C=US"
          fi

      - name: Build native libs & package signed Android APK with ForegroundService
        run: |
          set -e
          mkdir -p android/jniLibs android/build/classes android/build/apk_root/lib target/release/apk
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o android/jniLibs build --release -p yr-app --lib

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"

          "$BUILD_TOOLS/aapt2" compile --dir android/res -o android/build/res.zip
          "$BUILD_TOOLS/aapt2" link -I "$ANDROID_JAR" \
            --manifest android/AndroidManifest.xml \
            -o android/build/base.apk \
            android/build/res.zip

          javac -source 8 -target 8 -classpath "$ANDROID_JAR" \
            -d android/build/classes \
            android/src/com/yr/music/*.java

          "$BUILD_TOOLS/d8" --min-api 24 --lib "$ANDROID_JAR" \
            --output android/build \
            android/build/classes/com/yr/music/*.class

          cp -r android/jniLibs/* android/build/apk_root/lib/
          cp android/build/classes.dex android/build/apk_root/
          (cd android/build/apk_root && zip -r ../base.apk .)

          "$BUILD_TOOLS/zipalign" -f -p 4 android/build/base.apk android/build/aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks yr-release.keystore \
            --ks-pass pass:yr_ci_password \
            --key-pass pass:yr_ci_password \
            --ks-key-alias yr \
            --out target/release/apk/yr_app.apk \
            android/build/aligned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yr-music-android-apk
          path: target/release/apk/*.apk
          if-no-files-found: error

  emulator-test:
    name: Android Emulator Smoke Test & Screenshots
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: yr-music-android-apk
          path: apk-to-test/

      - name: Grant execute permission for smoke test script
        run: chmod +x tools/emulator-smoke-test.sh

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ensure Android SDK permissions
        run: |
          sudo chown -R $USER:$USER "$ANDROID_HOME" 2>/dev/null || true
          sudo chmod -R u+rwX "$ANDROID_HOME" 2>/dev/null || true
          rm -rf "$ANDROID_HOME/.downloadIntermediates" 2>/dev/null || true

      - name: Run YR Music on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
          script: ./tools/emulator-smoke-test.sh

      - name: Upload Emulator Screenshots & Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yr-emulator-results
          path: |
            screenshots/
            emulator-logcat.log
          retention-days: 10
